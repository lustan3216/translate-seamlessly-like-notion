<body><header><i>T</i>Teahouse Notes</header><main><p class="kicker">旅行・6分で読めます</p><h1>京都のゆったりした朝</h1>
<img src="kyoto-tea.jpg" alt=""><p>京都の古い茶屋は、観光バスが来る前の早朝から開いています。</p><p>抹茶を一杯頼んで庭のそばに座り、街が目覚めていくのを感じてください。</p><p>多くの茶屋は昼には閉まるので、9時前に着くのがおすすめです。</p><h2>おすすめの席</h2><p>縁側の席をお願いしてみてください。庭は季節ごとに表情を変え、お店の人が今咲いている花について喜んで教えてくれます。</p><p>時間があれば、そのあと近くのお寺まで歩いてみましょう。疏水沿いの道は10時ごろまで静かです。</p></main></body></html>
